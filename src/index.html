<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DigiStory</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- CABEÇALHO -->

    <header>

        <h1>DIGISTORY</h1>

<nav>

    <button id="inicio">
        Início
    </button>

    <button id="sobre">
        Sobre
    </button>

    <button id="botaoTema">
        🌙 Tema escuro
    </button>

</nav>
    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main>


        <section class="topo">

            <h2>Lista de Digimon</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar Digimon..."
            >

        </section>


        <!-- CARDS -->

        <section
            class="digimon-grid"
            id="digimonGrid"
        >

            <div class="carregando">
                Carregando Digimons...
            </div>

        </section>


    </main>


    <footer>

        <p>
            © 2026 DigiStory
        </p>

    </footer>


    <!-- SCRIPT -->

    <script src="css/script.js"></script>
    <script src="css/tema.js"></script>
    <script src="css/script.js"></script>



</body>

</html>
