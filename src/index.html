<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DigiStory</title>

    <link rel="stylesheet" href="css/style.css">

<body>

    <header>
        <h1>DIGISTORY</h1>

        <nav>
            <button id="inicio">Início</button>
            <button id="sobre">Sobre</button>
        </nav>

    <main>

        <section class="topo">
            <h2>Lista de Digimon</h2>

            <input

                id="pesquisa"
                placeholder="Pesquisar Digimon..."

        </section>

            <article class="digimon-card">

                <div class="digimon-info">
                    <h3>Agumon</h3>
                    <p>Rookie</p>

                    <button class="info-btn">
                        Ver informações
                    </button>
                </div>

            </article>
