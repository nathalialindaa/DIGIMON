<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="css/style.css">
    <title>DigiStory</title>
</head>
<body>

    <header class="topo-pagina">
        <h1>DIGISTORY</h1>
    </header>

 <footer>
        <nav>
            <a href="#">Início</a>
            <a href="#">Favoritos</a>
            <a href="#">Adicionar</a>
            <a href="#">Perfil</a>
        </nav>
    </footer>

    <main>

        <article class="digimon-card">

            <div class="digimon-header">
                <span class="digimon-id">#001</span>
                <h2>Agumon</h2>
            </div>

            <div class="digimon-image">
                <img src="https://gaming-cdn.com/images/news/articles/18649/cover/1000x563/digimon-story-time-stranger-vai-receber-uma-grande-expansao-em-2027-cover69bfbd6988430.jpg" alt="Imagem do Agumon">
            

            </div>

            <section class="description">

                <h3>Descrição</h3>

                <p>
                    Um Digimon do tipo réptil que possui um grande
                    potencial de evolução e batalha.
                </p> <br>

            </section>

        <section class="digimon-info">

            <div class="info-item">
            <strong>Tipo</strong> <br>
            <span class="tag-reptil">Réptil</span>
            </div> <br>

            <div class="info-item">
            <strong>Nível</strong> <br>
            <span class="tag-novato">Novato</span>
            </div> <br>

            <div class="info-item">
            <strong>Atributo</strong> <br>
            <span class="tag-vacina">Vacina</span>
            </div> <br>

            <div class="info-item">
            <strong> Habilidades</strong> <br>
            <span class="tag-pequenachama">Pequena Chama</span>
            <span class="tag-garra">Garra</span> 
            </div> <br>
            

        </section>

        </main>

</body>

</html>
